<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pay & Go</title>
  <!-- Google Fonts: Poppins (Heading) & Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Main CSS -->
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="login-wrapper">
    <div class="login-container">
      
      <!-- Brand Logo Header -->
      <header class="login-header">
        <div class="logo-container">
          <!-- Inline SVG Logo: Green Shopping Bag / Wallet hybrid with a tick mark -->
          <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <defs>
              <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2ecc71" />
                <stop offset="100%" stop-color="#27ae60" />
              </linearGradient>
            </defs>
            <rect x="20" y="30" width="60" height="50" rx="12" fill="url(#greenGrad)" />
            <path d="M35,30 C35,18 40,12 50,12 C60,12 65,18 65,30" fill="none" stroke="url(#greenGrad)" stroke-width="8" stroke-linecap="round" />
            <circle cx="50" cy="55" r="10" fill="#ffffff" />
            <path d="M47,55 L52,60 L60,49" fill="none" stroke="#27ae60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="logo-text">Pay <span class="logo-text-accent">&amp; Go</span></span>
        </div>
      </header>

      <!-- Login Card -->
      <div class="login-card" id="loginCard">
        <div class="card-header">
          <h1>Selamat Datang Kembali</h1>
          <p>Masuk ke akun Pay &amp; Go Anda untuk melanjutkan</p>
        </div>

        <!-- Alert Error Message -->
        <div class="error-banner" id="errorBanner" aria-live="polite">
          <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="errorMessage">Kredensial login salah. Silakan coba lagi.</span>
          <button type="button" class="close-error-btn" id="closeErrorBtn" aria-label="Tutup pesan error">
            &times;
          </button>
        </div>

        <!-- Form Login -->
        <form class="login-form" id="loginForm" novalidate>
          
          <!-- Input User Identifier -->
          <div class="input-group">
            <label for="username">Nomor Karyawan / Email Admin</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input 
                type="text" 
                id="username" 
                name="username" 
                placeholder="Contoh: 12345 atau admin@payandgo.com" 
                required 
                autocomplete="username"
              >
            </div>
            <span class="field-error" id="usernameError">Nomor Karyawan atau Email harus diisi</span>
          </div>

          <!-- Input Password -->
          <div class="input-group">
            <div class="label-row">
              <label for="password">Password</label>
              <a href="#" class="forgot-link" tabindex="-1">Lupa Password?</a>
            </div>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Masukkan password Anda" 
                required 
                autocomplete="current-password"
              >
              <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Tampilkan password">
                <!-- Eye Icon -->
                <svg class="eye-icon" id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <!-- Eye Off Icon (Hidden by default) -->
                <svg class="eye-icon hidden" id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <span class="field-error" id="passwordError">Password harus diisi</span>
          </div>

          <!-- Remember Me Checkbox -->
          <div class="remember-group">
            <label class="checkbox-container">
              <input type="checkbox" id="rememberMe" name="rememberMe">
              <span class="checkmark"></span>
              Ingat saya di perangkat ini
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="submit-btn" id="submitBtn">
            <span class="btn-text">Masuk ke Akun</span>
            <div class="spinner-container hidden" id="btnSpinner">
              <svg class="spinner" viewBox="0 0 50 50">
                <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
              </svg>
            </div>
          </button>
        </form>

        <!-- Register Link Footer -->
        <footer class="card-footer">
          <p>Belum memiliki akun? <a href="register.html" class="register-link">Daftar sekarang</a></p>
        </footer>
      </div>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
